            <div style={{ marginBottom:"12px" }}>
              <div style={{ fontFamily:"'DM Mono',monospace", fontSize:"9px", color:"rgba(255,255,255,0.28)", letterSpacing:"0.1em", marginBottom:"6px" }}>TAGS <span style={{ opacity:0.5 }}>(comma separated)</span></div>
              <input value={tags} onChange={e=>setTags(e.target.value)} placeholder="health, daily, client…"
                style={{ width:"100%", padding:"10px 12px", background:"rgba(255,255,255,0.05)", border:"1px solid rgba(255,255,255,0.1)", borderRadius:"10px", color:"#f0ede8", fontFamily:"'DM Mono',monospace", fontSize:"12px", outline:"none", boxSizing:"border-box" }}/>
            </div>
            <div style={{ marginBottom:"18px" }}>
              <div style={{ fontFamily:"'DM Mono',monospace", fontSize:"9px", color:"rgba(255,255,255,0.28)", letterSpacing:"0.1em", marginBottom:"7px" }}>RECURRENCE</div>
              <div style={{ display:"flex", gap:"6px" }}>
                {RECUR_OPTIONS.map(r=>(
                  <button key={r.key} onClick={()=>setRecurrence(r.key)} style={{ flex:1, padding:"8px 4px", background:recurrence===r.key?"rgba(255,255,255,0.12)":"rgba(255,255,255,0.04)", border:`1px solid ${recurrence===r.key?"rgba(255,255,255,0.22)":"rgba(255,255,255,0.08)"}`, borderRadius:"9px", cursor:"pointer", transition:"all 0.15s" }}>
                    <div style={{ fontFamily:"'DM Mono',monospace", fontSize:"12px", color:recurrence===r.key?"#f0ede8":"rgba(255,255,255,0.4)" }}>{r.icon}</div>
                    <div style={{ fontFamily:"'DM Mono',monospace", fontSize:"8px", color:recurrence===r.key?"rgba(255,255,255,0.7)":"rgba(255,255,255,0.25)", marginTop:"2px", letterSpacing:"0.04em" }}>{r.label}</div>
                  </button>
                ))}
              </div>
            </div>
            <div style={{ display:"flex", gap:"8px" }}>
              <button onClick={()=>setStep(1)} style={{ padding:"13px 16px", background:"rgba(255,255,255,0.04)", border:"1px solid rgba(255,255,255,0.09)", borderRadius:"12px", color:"rgba(255,255,255,0.4)", fontFamily:"'DM Mono',monospace", fontSize:"12px", cursor:"pointer" }}>← Back</button>
              {isEdit && onDelete && (
                <button onClick={onDelete} style={{ padding:"13px 14px", background:"rgba(245,101,101,0.1)", border:"1px solid rgba(245,101,101,0.25)", color:"#F56565", fontFamily:"'DM Mono',monospace", fontSize:"12px", borderRadius:"12px", cursor:"pointer" }}>🗑</button>
              )}
              <button onClick={()=>onSave({title,category,suitName,desc,tags,duration,energy,recurrence,scope})} style={{ flex:1, padding:"13px", background:`linear-gradient(135deg,${cat.color}cc,${cat.color}88)`, border:"none", borderRadius:"12px", color:"#0c0c10", fontFamily:"'DM Mono',monospace", fontWeight:500, fontSize:"13px", cursor:"pointer", letterSpacing:"0.05em" }}>
                {isEdit ? "Save Changes ✓" : "Add to Library ✓"}
              </button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

// ── PLANNER ───────────────────────────────────────────────────────
function Planner({ decks, cards, schedule, onScheduleChange, quickCards, onQuickChange, archive, onArchiveChange, retentionDays, onRetentionChange, onSaveToLibrary, capMode, onCapModeChange, customMin, customEnergy, currentUserId, onUpdateCard, onLaunchSession, completedIds, onSetCompletedIds, currentEnergy, onEnergyChange, onEditCard, onDeleteCard, sharedArchive, onSharedArchive, completedSessions }) {
  const [calMode,      setCalMode]      = useState("month");
  const [cursor,       setCursor]       = useState(new Date(today()));
  const [selDay,       setSelDay]       = useState(todayKey);
  const [showPicker,   setShowPicker]   = useState(false);
  const [showQuickForm,setShowQuickForm]= useState(false);
  const [qTitle,       setQTitle]       = useState("");
  const [qCat,         setQCat]         = useState("Work");
  const [qDur,         setQDur]         = useState(25);
  const [showArchive,     setShowArchive]     = useState(false);
  const [skippedRecurring, setSkippedRecurring] = useState({});
  const [editRetention,setEditRetention]= useState(false);
  const [playDeck,     setPlayDeck]     = useState(null);
  const [showSync,     setShowSync]     = useState(false);

  const myDecks  = decks.filter(d=>d.ownerId===currentUserId||d.scope==="shared");
  const selDecks = (schedule[selDay]||[]).map(id=>decks.find(d=>d.id===id)).filter(Boolean);
  const selDate  = selDay ? new Date(selDay+"T12:00:00") : null;
  const isToday  = selDay===todayKey;

  function dayLoad(key) {
    const deckLoad = (schedule[key]||[]).reduce((s,did)=>{ const dk=decks.find(d=>d.id===did); if(!dk) return s; return s+cards.filter(c=>dk.cardIds.includes(c.id)).reduce((ss,c)=>ss+c.duration,0); },0);
    const quickLoad = (quickCards[key]||[]).filter(q=>!q.done).reduce((s,q)=>s+(q.duration||25),0);
    const skipped = skippedRecurring[key] || [];
    const recurLoad = recurringCardsForDay(key).filter(c=>c.ownerId===currentUserId&&!skipped.includes(c.id)).reduce((s,c)=>s+c.duration,0);
    return deckLoad + quickLoad + recurLoad;
  }
  function dayLight(key) { const m=dayLoad(key); const b=capMode==="custom"?customMin:CAP_MODES[capMode]?.budgetMin; return getLight(m,b); }
  function toggleDeck(deckId) { const cur=schedule[selDay]||[]; const next=cur.includes(deckId)?cur.filter(x=>x!==deckId):[...cur,deckId]; onScheduleChange({...schedule,[selDay]:next}); }

  const dayQuick = (key) => quickCards[key] || [];

  function addQuick() {
    if (!qTitle.trim()) return;
    const qc = { id:"q"+Date.now(), title:qTitle.trim(), category:qCat, duration:qDur, done:false };
    onQuickChange({ ...quickCards, [selDay]: [...dayQuick(selDay), qc] });
    setQTitle(""); setQDur(25); setShowQuickForm(false);
  }
  function deleteQuick(qid) {
    onQuickChange({ ...quickCards, [selDay]: dayQuick(selDay).filter(q => q.id !== qid) });
  }
  function markQuickDone(qid) {
    onQuickChange({ ...quickCards, [selDay]: dayQuick(selDay).map(q =>
      q.id===qid ? {...q, done:true, completedAt: new Date().toISOString()} : q
    )});
  }
  function undoQuickDone(qid) {
    onQuickChange({ ...quickCards, [selDay]: dayQuick(selDay).map(q =>
      q.id===qid ? {...q, done:false, completedAt:null} : q
    )});
  }
  function saveQuickToLibrary(qid, dayKey) {
    const qc = dayQuick(dayKey||selDay).find(q=>q.id===qid);
    if (!qc) return;
    onSaveToLibrary({ title:qc.title, category:qc.category, duration:qc.duration, energy:2, desc:"", tags:[], suitName:CATS[qc.category]?.label||"", scope:"personal" });
    onQuickChange({ ...quickCards, [dayKey||selDay]: dayQuick(dayKey||selDay).filter(q=>q.id!==qid) });
  }
  function archiveQuick(qid, dayKey) {
    const dk = dayKey||selDay;
    const qc = dayQuick(dk).find(q=>q.id===qid);
    if (!qc) return;
    const archiveItem = { id:qc.id, title:qc.title, category:qc.category, duration:qc.duration, originDay:dk, archivedAt: new Date().toISOString() };
    onArchiveChange([...archive, archiveItem]);
    onQuickChange({ ...quickCards, [dk]: dayQuick(dk).filter(q=>q.id!==qid) });
  }
  function restoreFromArchive(aid) {
    const item = archive.find(a=>a.id===aid);
    if (!item) return;
    const restored = { id:"q"+Date.now(), title:item.title, category:item.category, duration:item.duration, done:false, completedAt:null };
    onQuickChange({ ...quickCards, [item.originDay]: [...dayQuick(item.originDay), restored] });
    onArchiveChange(archive.filter(a=>a.id!==aid));
  }
  function saveArchiveToLibrary(aid) {
    const item = archive.find(a=>a.id===aid);
    if (!item) return;
    onSaveToLibrary({ title:item.title, category:item.category, duration:item.duration, energy:2, desc:"", tags:[], suitName:CATS[item.category]?.label||"", scope:"personal" });
    onArchiveChange(archive.filter(a=>a.id!==aid));
  }
  function deleteArchiveItem(aid) { onArchiveChange(archive.filter(a=>a.id!==aid)); }
  function daysUntilPurge(archivedAt) {
    const elapsed = (Date.now() - new Date(archivedAt).getTime()) / 86400000;
    return Math.max(0, Math.ceil(retentionDays - elapsed));
  }

  function recurringCardsForDay(key) {
    return cards.filter(c => cardOccursOn(c, key));
  }
  function dayCapacity(key) {
    const deckCards = (schedule[key] || []).flatMap(did => {
      const dk = decks.find(d => d.id === did);
      return dk ? cards.filter(c => dk.cardIds.includes(c.id)) : [];
    });
    const skipped = skippedRecurring[key] || [];
    const recurCards = recurringCardsForDay(key).filter(c => c.ownerId === currentUserId && !skipped.includes(c.id));
    const quickC = (quickCards[key] || []).filter(q => !q.done).map(q => ({ duration: q.duration || 25, energy: 2 }));
    const all = [...deckCards, ...recurCards, ...quickC];
    return { totalMin: all.reduce((s,c)=>s+c.duration,0), energyLoad: all.reduce((s,c)=>s+c.duration*(c.energy/5),0) };
  }
  function skipRecurring(cardId, dayKey) {
    setSkippedRecurring(prev => ({ ...prev, [dayKey]: [...(prev[dayKey]||[]), cardId] }));
  }
  function unskipRecurring(cardId, dayKey) {
    setSkippedRecurring(prev => ({ ...prev, [dayKey]: (prev[dayKey]||[]).filter(id=>id!==cardId) }));
  }

  function buildMonth() {
    const year=cursor.getFullYear(), month=cursor.getMonth();
    const first=new Date(year,month,1).getDay(), days=new Date(year,month+1,0).getDate();
    const cells=[]; for(let i=0;i<first;i++) cells.push(null); for(let i=1;i<=days;i++) cells.push(new Date(year,month,i)); return cells;
  }
  function buildWeek() { const dow=cursor.getDay(); return Array.from({length:7},(_,i)=>{ const d=new Date(cursor); d.setDate(cursor.getDate()-dow+i); return d; }); }

  // Deck play view
  if(playDeck) {
    const dc   = cards.filter(c=>playDeck.cardIds.includes(c.id));
    const remaining = dc.filter(c=>!completedIds.includes(c.id));
    const withinEnergy = currentEnergy===0 ? remaining : remaining.filter(c=>c.energy<=currentEnergy);
    const aboveEnergy  = currentEnergy===0 ? [] : remaining.filter(c=>c.energy>currentEnergy);
    return (
      <div>
        <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"12px" }}>
          <button onClick={()=>{ setPlayDeck(null); onSetCompletedIds([]); }} style={{ background:"rgba(255,255,255,0.05)", border:"1px solid rgba(255,255,255,0.09)", color:"rgba(255,255,255,0.4)", fontFamily:"'DM Mono',monospace", fontSize:"11px", padding:"6px 12px", borderRadius:"8px", cursor:"pointer" }}>← back</button>
          <div>
            <div style={{ fontFamily:"'DM Serif Display',serif", fontSize:"18px" }}>{playDeck.icon} {playDeck.name}</div>
            <div style={{ fontFamily:"'DM Mono',monospace", fontSize:"10px", color:"rgba(255,255,255,0.3)", marginTop:"2px" }}>
              {completedIds.filter(id=>playDeck.cardIds.includes(id)).length} of {playDeck.cardIds.length} done
            </div>
          </div>
          <div style={{ display:"flex", gap:"3px", marginLeft:"auto" }}>
            {playDeck.cardIds.map(id=><div key={id} style={{ width:"8px", height:"8px", borderRadius:"50%", background:completedIds.includes(id)?playDeck.color:"rgba(255,255,255,0.1)", transition:"background 0.3s" }}/>)}
          </div>
        </div>

        <div style={{ display:"flex", alignItems:"center", gap:"8px", marginBottom:"12px", padding:"10px 12px", background:"rgba(255,255,255,0.025)", border:"1px solid rgba(255,255,255,0.07)", borderRadius:"12px" }}>
          <span style={{ fontFamily:"'DM Mono',monospace", fontSize:"9px", color:"rgba(255,255,255,0.3)", letterSpacing:"0.08em", flexShrink:0 }}>I CAN HANDLE</span>
          <div style={{ display:"flex", gap:"5px", flex:1 }}>
            {[1,2,3,4,5].map(lvl=>{
              const e=ENERGY[lvl]; const active=currentEnergy===lvl;
              return (
                <button key={lvl} onClick={()=>onEnergyChange(active?0:lvl)} style={{ flex:1, height:"28px", borderRadius:"8px", background:active?e.bar:"rgba(255,255,255,0.04)", border:`1px solid ${active?e.bar:"rgba(255,255,255,0.08)"}`, cursor:"pointer", transition:"all 0.15s", position:"relative" }}>
                  {active&&<div style={{ position:"absolute", top:"-4px", left:"50%", transform:"translateX(-50%)", width:"4px", height:"4px", borderRadius:"50%", background:e.bar }}/>}
                </button>
              );
            })}
          </div>
          {currentEnergy>0
            ? <span style={{ fontFamily:"'DM Mono',monospace", fontSize:"9px", color:ENERGY[currentEnergy].bar, flexShrink:0 }}>level {currentEnergy} & below</span>
            : <span style={{ fontFamily:"'DM Mono',monospace", fontSize:"9px", color:"rgba(255,255,255,0.22)", flexShrink:0 }}>all levels</span>
          }
        </div>

        <CapMeter deckCards={dc} mode={capMode} customMin={customMin} customEnergy={customEnergy}/>

        {remaining.length > 0 ? (
          <div style={{ display:"flex", flexDirection:"column", gap:"9px" }}>
            {withinEnergy.map((card,i)=>(
              <div key={card.id} style={{ position:"relative" }}>
                <CardTile card={card} index={i} visible onClick={()=>onLaunchSession(card, playDeck, selDay)}/>
                {i===0&&withinEnergy.length>0&&<div style={{ position:"absolute", top:"11px", right:"11px", fontFamily:"'DM Mono',monospace", fontSize:"9px", background:playDeck.color, color:"#0c0c10", padding:"3px 8px", borderRadius:"20px", fontWeight:500, pointerEvents:"none" }}>NEXT UP</div>}
              </div>
            ))}
            {aboveEnergy.length>0&&(
              <div style={{ marginTop:"4px" }}>
                <div style={{ fontFamily:"'DM Mono',monospace", fontSize:"9px", color:"rgba(255,255,255,0.22)", letterSpacing:"0.08em", marginBottom:"6px", display:"flex", alignItems:"center", gap:"6px" }}>
                  <div style={{ flex:1, height:"1px", background:"rgba(255,255,255,0.06)" }}/>HIGH ENERGY — save for later<div style={{ flex:1, height:"1px", background:"rgba(255,255,255,0.06)" }}/>
                </div>
                {aboveEnergy.map((card,i)=>(
                  <div key={card.id} style={{ opacity:0.38, marginBottom:"9px" }}>
                    <CardTile card={card} index={i} visible onClick={()=>onLaunchSession(card, playDeck, selDay)}/>
                  </div>
                ))}
              </div>
            )}
          </div>
        ) : (
          <div style={{ textAlign:"center", padding:"50px 20px" }}>
            <div style={{ fontSize:"28px", marginBottom:"10px" }}>✓</div>
            <div style={{ fontFamily:"'DM Mono',monospace", fontSize:"11px", color:"rgba(255,255,255,0.3)" }}>Deck complete</div>
            <button onClick={()=>onSetCompletedIds([])} style={{ marginTop:"14px", background:"rgba(255,255,255,0.05)", border:"1px solid rgba(255,255,255,0.09)", color:"rgba(255,255,255,0.4)", fontFamily:"'DM Mono',monospace", fontSize:"11px", padding:"9px 18px", borderRadius:"9px", cursor:"pointer" }}>Reset</button>
          </div>
        )}
      </div>
    );
  }

  // Calendar view
  return (
    <div>
      {/* ── STATS PANEL ── */}
      <StatsPanel sessions={completedSessions} currentUserId={currentUserId}/>

      {/* Header */}
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:"12px" }}>
        <div style={{ fontFamily:"'DM Serif Display',serif", fontSize:"20px" }}>
          {calMode==="month" ? `${MONTHS[cursor.getMonth()]} ${cursor.getFullYear()}` : `Week of ${MONTHS[buildWeek()[0].getMonth()]} ${buildWeek()[0].getDate()}`}
        </div>
        <div style={{ display:"flex", gap:"5px", alignItems:"center" }}>
          <button onClick={()=>setShowSync(true)} title="Calendar sync & backup" style={{ background:"rgba(99,179,237,0.08)", border:"1px solid rgba(99,179,237,0.22)", color:"#63B3ED", fontSize:"12px", width:"26px", height:"26px", borderRadius:"7px", cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center" }}>📅</button>
          <button onClick={()=>{ setCursor(new Date(today())); setSelDay(todayKey); }} style={{ background:"rgba(255,255,255,0.05)", border:"1px solid rgba(255,255,255,0.08)", color:"rgba(255,255,255,0.45)", fontFamily:"'DM Mono',monospace", fontSize:"10px", padding:"4px 9px", borderRadius:"7px", cursor:"pointer" }}>Today</button>
          <div style={{ display:"flex", gap:"2px", background:"rgba(255,255,255,0.04)", borderRadius:"7px", padding:"2px" }}>
            {[["month","Mo"],["week","Wk"]].map(([m,l])=><button key={m} onClick={()=>setCalMode(m)} style={{ background:calMode===m?"rgba(255,255,255,0.1)":"transparent", border:"none", color:calMode===m?"#f0ede8":"rgba(255,255,255,0.35)", fontFamily:"'DM Mono',monospace", fontSize:"10px", padding:"3px 8px", borderRadius:"5px", cursor:"pointer" }}>{l}</button>)}
          </div>
          {["‹","›"].map((a,i)=><button key={a} onClick={()=>{ const d=new Date(cursor); calMode==="month"?d.setMonth(d.getMonth()+(i===0?-1:1)):d.setDate(d.getDate()+(i===0?-7:7)); setCursor(d); }} style={{ background:"rgba(255,255,255,0.04)", border:"1px solid rgba(255,255,255,0.07)", color:"rgba(255,255,255,0.45)", width:"26px", height:"26px", borderRadius:"6px", cursor:"pointer", fontSize:"13px", display:"flex", alignItems:"center", justifyContent:"center" }}>{a}</button>)}
        </div>
      </div>

      {/* DOW row */}
      <div style={{ display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:"2px", marginBottom:"3px" }}>
        {DOW.map(d=><div key={d} style={{ fontFamily:"'DM Mono',monospace", fontSize:"9px", color:"rgba(255,255,255,0.22)", textAlign:"center", letterSpacing:"0.06em", padding:"2px 0" }}>{d}</div>)}
      </div>

      {/* Month grid */}
      {calMode==="month" && (
        <div style={{ display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:"3px", marginBottom:"16px" }}>
          {buildMonth().map((d,i)=>{
            if(!d) return <div key={`e${i}`}/>;
            const key=dateKey(d), ids=schedule[key]||[], isSel=key===selDay, isTod=key===todayKey, light=dayLight(key), hasRecur=cards.some(c=>cardOccursOn(c,key)&&c.ownerId===currentUserId);
            const hasSess = completedSessions.some(s=>s.dayKey===key&&s.ownerId===currentUserId);
            return (
              <div key={key} onClick={()=>setSelDay(key)} style={{ aspectRatio:"1", borderRadius:"9px", padding:"3px", background:isSel?"rgba(255,255,255,0.1)":isTod?"rgba(255,255,255,0.04)":"transparent", border:`1px solid ${isSel?"rgba(255,255,255,0.2)":isTod?"rgba(255,255,255,0.1)":"rgba(255,255,255,0.04)"}`, cursor:"pointer", display:"flex", flexDirection:"column", alignItems:"center", gap:"2px", transition:"all 0.12s" }}>
                <span style={{ fontFamily:"'DM Mono',monospace", fontSize:"11px", color:isTod?"#F6AD55":isSel?"#f0ede8":"rgba(255,255,255,0.45)", fontWeight:isTod?"bold":"normal" }}>{d.getDate()}</span>
                {ids.length>0&&<div style={{ display:"flex", gap:"2px", flexWrap:"wrap", justifyContent:"center" }}>{ids.slice(0,3).map(id=>{ const dk=decks.find(x=>x.id===id); return dk?<div key={id} style={{ width:"4px", height:"4px", borderRadius:"50%", background:dk.color }}/>:null; })}</div>}
                {ids.length>0&&<div style={{ width:"4px", height:"4px", borderRadius:"50%", background:LC[light], opacity:0.7 }}/>}
                {hasRecur&&<div style={{ width:"4px", height:"4px", borderRadius:"50%", background:"rgba(255,255,255,0.3)", border:"1px solid rgba(255,255,255,0.4)" }}/>}
                {hasSess&&<div style={{ width:"4px", height:"4px", borderRadius:"50%", background:"#68D391", opacity:0.8 }}/>}
              </div>
            );
          })}
        </div>
      )}

      {/* Week grid */}
      {calMode==="week" && (
        <div style={{ display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:"4px", marginBottom:"16px" }}>
          {buildWeek().map(d=>{
            const key=dateKey(d), ids=schedule[key]||[], isSel=key===selDay, isTod=key===todayKey, light=dayLight(key), load=dayLoad(key);
            return (
              <div key={key} onClick={()=>setSelDay(key)} style={{ borderRadius:"11px", padding:"7px 5px", background:isSel?"rgba(255,255,255,0.08)":isTod?"rgba(255,255,255,0.03)":"rgba(255,255,255,0.02)", border:`1px solid ${isSel?"rgba(255,255,255,0.16)":isTod?"rgba(255,255,255,0.09)":"rgba(255,255,255,0.04)"}`, cursor:"pointer", minHeight:"80px", display:"flex", flexDirection:"column", alignItems:"center", gap:"3px", transition:"all 0.12s" }}>
                <span style={{ fontFamily:"'DM Mono',monospace", fontSize:"10px", color:isTod?"#F6AD55":isSel?"#f0ede8":"rgba(255,255,255,0.38)", fontWeight:isTod?"bold":"normal" }}>{d.getDate()}</span>
                <div style={{ display:"flex", flexDirection:"column", gap:"2px", width:"100%" }}>
                  {ids.map(id=>{ const dk=decks.find(x=>x.id===id); return dk?<div key={id} style={{ background:`${dk.color}22`, border:`1px solid ${dk.color}44`, borderRadius:"4px", padding:"1px 3px", display:"flex", alignItems:"center", gap:"2px" }}><span style={{ fontSize:"8px" }}>{dk.icon}</span><span style={{ fontFamily:"'DM Mono',monospace", fontSize:"7px", color:dk.color, overflow:"hidden", whiteSpace:"nowrap", textOverflow:"ellipsis" }}>{dk.name}</span></div>:null; })}
                </div>
                {load>0&&<div style={{ marginTop:"auto", display:"flex", alignItems:"center", gap:"2px" }}><div style={{ width:"4px", height:"4px", borderRadius:"50%", background:LC[light] }}/><span style={{ fontFamily:"'DM Mono',monospace", fontSize:"7px", color:"rgba(255,255,255,0.28)" }}>{fmtMins(load)}</span></div>}
              </div>
            );
          })}
        </div>
      )}

      {/* Selected day panel */}
      <div style={{ background:"rgba(255,255,255,0.025)", border:"1px solid rgba(255,255,255,0.07)", borderRadius:"14px", padding:"14px" }}>

        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:"12px" }}>
          <div>
            <div style={{ fontFamily:"'DM Serif Display',serif", fontSize:"16px", color:"#f0ede8" }}>
              {isToday?"Today — ":""}{selDate?.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"})}
            </div>
            {selDecks.length>0&&<div style={{ fontFamily:"'DM Mono',monospace", fontSize:"10px", color:"rgba(255,255,255,0.3)", marginTop:"2px" }}>{selDecks.length} deck{selDecks.length!==1?"s":""}</div>}
          </div>
          <button onClick={()=>setShowPicker(true)} style={{ background:"rgba(255,255,255,0.06)", border:"1px solid rgba(255,255,255,0.1)", color:"rgba(255,255,255,0.55)", fontFamily:"'DM Mono',monospace", fontSize:"10px", padding:"6px 12px", borderRadius:"9px", cursor:"pointer", flexShrink:0 }}>+ Add Deck</button>
        </div>

        {/* ── DAY CAPACITY METER ── */}
        {(function() {
          const cap = dayCapacity(selDay);
          if (cap.totalMin === 0) return null;
          const bMin = capMode === "custom" ? customMin : CAP_MODES[capMode] ? CAP_MODES[capMode].budgetMin : null;
          const bEng = capMode === "custom" ? customEnergy : CAP_MODES[capMode] ? CAP_MODES[capMode].energyBudget : null;
          const tl = getLight(cap.totalMin, bMin);
          const el = getLight(cap.energyLoad, bEng);
          const ol = (tl==="red"||el==="red")?"red":(tl==="yellow"||el==="yellow")?"yellow":"green";
          const status = ol==="green"?"Good to go":ol==="yellow"?"Getting full":"Overloaded";
          const tp = bMin ? Math.min(1, cap.totalMin/bMin) : 0;
          const ep = bEng ? Math.min(1, cap.energyLoad/bEng) : 0;
          return (
            <div style={{ background:"linear-gradient(135deg,"+LB[ol]+",rgba(14,14,20,0.85))", border:"1px solid "+LC[ol]+"44", borderRadius:"12px", padding:"12px 14px", marginBottom:"14px" }}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:"10px" }}>
                <div style={{ display:"flex", alignItems:"center", gap:"7px" }}>
                  <div style={{ width:"8px", height:"8px", borderRadius:"50%", background:LC[ol], boxShadow:"0 0 6px "+LC[ol]+"88" }}/>
                  <span style={{ fontFamily:"'DM Serif Display',serif", fontSize:"14px", color:"#f0ede8" }}>Day Capacity</span>
                </div>
                <div style={{ display:"flex", alignItems:"center", gap:"6px" }}>
                  <span style={{ fontFamily:"'DM Mono',monospace", fontSize:"9px", color:LC[ol], background:LC[ol]+"18", border:"1px solid "+LC[ol]+"44", padding:"2px 8px", borderRadius:"10px" }}>{status}</span>
                  {/* ── WIRED CAP MODE BUTTONS ── */}
                  {Object.entries(CAP_MODES).map(([k,m])=>(
                    <button key={k} onClick={()=>onCapModeChange(k)} title={m.label}
                      style={{ background:capMode===k?"rgba(255,255,255,0.14)":"rgba(255,255,255,0.04)", border:"1px solid "+(capMode===k?"rgba(255,255,255,0.22)":"rgba(255,255,255,0.07)"), color:capMode===k?"#f0ede8":"rgba(255,255,255,0.3)", fontFamily:"'DM Mono',monospace", fontSize:"9px", padding:"3px 7px", borderRadius:"6px", cursor:"pointer", transition:"all 0.15s" }}>
                      {m.icon}
                    </button>
                  ))}
                </div>
              </div>
              <div style={{ marginBottom:"8px" }}>
                <div style={{ display:"flex", justifyContent:"space-between", marginBottom:"3px" }}>
                  <span style={{ fontFamily:"'DM Mono',monospace", fontSize:"9px", color:"rgba(255,255,255,0.32)", letterSpacing:"0.08em" }}>TIME</span>
                  <span style={{ fontFamily:"'DM Mono',monospace", fontSize:"10px", color:"rgba(255,255,255,0.55)" }}>{fmtMins(cap.totalMin)}{bMin?" / "+fmtMins(bMin):""}</span>
                </div>
                <div style={{ height:"5px", background:"rgba(255,255,255,0.07)", borderRadius:"3px", overflow:"hidden" }}>
                  <div style={{ height:"100%", width:(tp*100)+"%", background:LC[tl], borderRadius:"3px", transition:"width 0.4s ease" }}/>
                </div>
              </div>
              <div style={{ marginBottom:"10px" }}>
                <div style={{ display:"flex", justifyContent:"space-between", marginBottom:"3px" }}>
                  <span style={{ fontFamily:"'DM Mono',monospace", fontSize:"9px", color:"rgba(255,255,255,0.32)", letterSpacing:"0.08em" }}>ENERGY LOAD</span>
                  <span style={{ fontFamily:"'DM Mono',monospace", fontSize:"10px", color:"rgba(255,255,255,0.55)" }}>{Math.round(cap.energyLoad)}{bEng?" / "+bEng+" pts":" pts"}</span>
                </div>
                <div style={{ height:"5px", background:"rgba(255,255,255,0.07)", borderRadius:"3px", overflow:"hidden" }}>
                  <div style={{ height:"100%", width:(ep*100)+"%", background:LC[el], borderRadius:"3px", transition:"width 0.4s ease" }}/>
                </div>
              </div>
              <div style={{ display:"flex", alignItems:"center", gap:"8px", paddingTop:"10px", borderTop:"1px solid rgba(255,255,255,0.06)" }}>
                <span style={{ fontFamily:"'DM Mono',monospace", fontSize:"9px", color:"rgba(255,255,255,0.28)", letterSpacing:"0.06em", flexShrink:0 }}>MY ENERGY</span>
                <div style={{ display:"flex", gap:"4px", flex:1 }}>
                  {[1,2,3,4,5].map(lvl=>{
                    const e=ENERGY[lvl]; const active=currentEnergy===lvl;
                    return (
                      <button key={lvl} onClick={()=>onEnergyChange(active?0:lvl)} title={"Energy "+lvl}
                        style={{ flex:1, height:"22px", borderRadius:"6px", background:active?e.bar:"rgba(255,255,255,0.05)", border:"1px solid "+(active?e.bar:"rgba(255,255,255,0.08)"), cursor:"pointer", transition:"all 0.15s", position:"relative" }}>
                        {active&&<div style={{ position:"absolute", top:"-4px", left:"50%", transform:"translateX(-50%)", width:"4px", height:"4px", borderRadius:"50%", background:e.bar }}/>}
                      </button>
                    );
                  })}
                </div>
                <span style={{ fontFamily:"'DM Mono',monospace", fontSize:"9px", flexShrink:0, color:currentEnergy>0?ENERGY[currentEnergy].bar:"rgba(255,255,255,0.2)" }}>
                  {currentEnergy>0?"level "+currentEnergy+" & below":"all levels"}
                </span>
              </div>
              {ol==="red"&&<div style={{ marginTop:"8px", fontFamily:"'DM Mono',monospace", fontSize:"9px", color:"#F56565", background:"rgba(245,101,101,0.08)", borderRadius:"7px", padding:"6px 10px" }}>⚠ Day is overloaded — consider removing a deck or shifting tasks.</div>}
              {ol==="yellow"&&<div style={{ marginTop:"8px", fontFamily:"'DM Mono',monospace", fontSize:"9px", color:"#F6AD55", background:"rgba(246,173,85,0.08)", borderRadius:"7px", padding:"6px 10px" }}>⏳ Getting close to your limit — you may not finish everything.</div>}
            </div>
          );
        })()}

        {selDecks.length===0 ? (
          <div style={{ textAlign:"center", padding:"20px 0", fontFamily:"'DM Mono',monospace", fontSize:"10px", color:"rgba(255,255,255,0.2)" }}>Nothing scheduled — tap + Add Deck</div>
        ) : (
          <div style={{ display:"flex", flexDirection:"column", gap:"7px" }}>
            {selDecks.map(deck=>{
              const dc=cards.filter(c=>deck.cardIds.includes(c.id));
              const { totalMin }=calcCap(dc);
              const bMin=capMode==="custom"?customMin:CAP_MODES[capMode]?.budgetMin;
              const light=getLight(totalMin,bMin);
              return (
                <SwipeableRow key={deck.id} onEdit={null} onRemove={()=>toggleDeck(deck.id)} removeLabel="Unschedule">
                  <div style={{ background:`${deck.color}0d`, border:`1px solid ${deck.color}33`, borderRadius:"12px", padding:"10px 12px", display:"flex", alignItems:"center", gap:"10px" }}>
                    <span style={{ fontSize:"18px" }}>{deck.icon}</span>
                    <div style={{ flex:1 }}>
                      <div style={{ fontFamily:"'DM Serif Display',serif", fontSize:"14px", color:"#f0ede8" }}>{deck.name}</div>
                      <div style={{ display:"flex", alignItems:"center", gap:"6px", marginTop:"2px" }}>
                        <span style={{ fontFamily:"'DM Mono',monospace", fontSize:"9px", color:"rgba(255,255,255,0.32)" }}>{dc.length} cards · {fmtMins(totalMin)}</span>
                        <div style={{ width:"5px", height:"5px", borderRadius:"50%", background:LC[light] }}/>
                      </div>
                    </div>
                    <button onClick={()=>{ setPlayDeck(deck); onSetCompletedIds([]); }} style={{ background:`${deck.color}cc`, border:"none", color:"#0c0c10", fontFamily:"'DM Mono',monospace", fontSize:"10px", fontWeight:500, padding:"6px 13px", borderRadius:"8px", cursor:"pointer", letterSpacing:"0.04em" }}>▶ Play</button>
                  </div>
                </SwipeableRow>
              );
            })}
          </div>
        )}

        {/* ── RECURRING CARDS ── */}
        {(()=>{
          const allRecur = recurringCardsForDay(selDay).filter(c=>c.ownerId===currentUserId);
          const skipped = skippedRecurring[selDay] || [];
          const activeRecur = allRecur.filter(c=>!skipped.includes(c.id));
          const skippedCards = allRecur.filter(c=>skipped.includes(c.id));
          if(allRecur.length===0) return null;
          return (
            <div style={{ marginTop:"12px" }}>
              <div style={{ display:"flex", alignItems:"center", gap:"8px", marginBottom:"8px" }}>
                <div style={{ flex:1, height:"1px", background:"rgba(255,255,255,0.06)" }}/>
                <span style={{ fontFamily:"'DM Mono',monospace", fontSize:"9px", color:"rgba(255,255,255,0.22)", letterSpacing:"0.1em" }}>RECURRING</span>
                <div style={{ flex:1, height:"1px", background:"rgba(255,255,255,0.06)" }}/>
              </div>
              <div style={{ display:"flex", flexDirection:"column", gap:"6px" }}>
                {activeRecur.map((card)=>{
                  const cat=getCat(card.category);
                  const recurLabel = RECUR_OPTIONS.find(r=>r.key===card.recurrence)?.label||"";
                  return (
                    <SwipeableRow key={card.id} onEdit={null} onRemove={()=>skipRecurring(card.id, selDay)} removeLabel="Skip today">
                      <div style={{ display:"flex", alignItems:"center", gap:"9px", padding:"9px 11px", background:cat.color+"0a", border:"1px solid "+cat.color+"22", borderRadius:"11px" }}>
                        <div style={{ width:"2px", alignSelf:"stretch", background:cat.color, borderRadius:"2px", opacity:0.6, minHeight:"28px", flexShrink:0 }}/>
                        <div style={{ flex:1, minWidth:0 }}>
                          <div style={{ fontFamily:"'DM Serif Display',serif", fontSize:"13px", color:"#f0ede8", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{card.title}</div>
                          <div style={{ fontFamily:"'DM Mono',monospace", fontSize:"9px", color:"rgba(255,255,255,0.28)", marginTop:"1px" }}>{cat.emoji} {cat.label} · {card.duration}m</div>
                        </div>
                        <span style={{ fontFamily:"'DM Mono',monospace", fontSize:"9px", color:"rgba(255,255,255,0.3)", background:"rgba(255,255,255,0.05)", border:"1px solid rgba(255,255,255,0.08)", padding:"2px 7px", borderRadius:"10px", flexShrink:0 }}>↻ {recurLabel}</span>
                        <button onClick={()=>onLaunchSession(card, null, selDay)} style={{ background:cat.color+"cc", border:"none", color:"#0c0c10", fontFamily:"'DM Mono',monospace", fontSize:"10px", fontWeight:500, padding:"5px 11px", borderRadius:"8px", cursor:"pointer", flexShrink:0 }}>▶</button>
                      </div>
                    </SwipeableRow>
                  );
                })}
                {skippedCards.length>0&&(
                  <div style={{ marginTop:"4px" }}>
                    {skippedCards.map(card=>{
                      const cat=getCat(card.category);
                      return (
                        <div key={card.id} style={{ display:"flex", alignItems:"center", gap:"9px", padding:"7px 11px", opacity:0.35, marginBottom:"5px" }}>
                          <div style={{ width:"2px", alignSelf:"stretch", background:cat.color, borderRadius:"2px", opacity:0.4, minHeight:"22px", flexShrink:0 }}/>
                          <div style={{ flex:1, minWidth:0 }}>
                            <div style={{ fontFamily:"'DM Serif Display',serif", fontSize:"12px", color:"rgba(255,255,255,0.4)", textDecoration:"line-through", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{card.title}</div>
                            <div style={{ fontFamily:"'DM Mono',monospace", fontSize:"9px", color:"rgba(255,255,255,0.22)", marginTop:"1px" }}>skipped today</div>
                          </div>
                          <button onClick={()=>unskipRecurring(card.id, selDay)} style={{ background:"rgba(255,255,255,0.06)", border:"1px solid rgba(255,255,255,0.1)", color:"rgba(255,255,255,0.4)", fontFamily:"'DM Mono',monospace", fontSize:"9px", padding:"3px 9px", borderRadius:"7px", cursor:"pointer", flexShrink:0 }}>Undo</button>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            </div>
          );
        })()}

        {/* ── QUICK CARDS ── */}
        <div style={{ marginTop:"14px" }}>
          <div style={{ display:"flex", alignItems:"center", gap:"8px", marginBottom:"10px" }}>
            <div style={{ flex:1, height:"1px", background:"rgba(255,255,255,0.06)" }}/>
            <span style={{ fontFamily:"'DM Mono',monospace", fontSize:"9px", color:"rgba(255,255,255,0.22)", letterSpacing:"0.1em" }}>QUICK CARDS</span>
            <div style={{ flex:1, height:"1px", background:"rgba(255,255,255,0.06)" }}/>
          </div>

          {dayQuick(selDay).length>0&&(
            <div style={{ display:"flex", flexDirection:"column", gap:"6px", marginBottom:"8px" }}>
              {dayQuick(selDay).map(qc=>{
                const cat=CATS[qc.category]||CATS.Work;
                return (
                  <SwipeableRow key={qc.id} onEdit={null} onRemove={()=>deleteQuick(qc.id)} removeLabel="Delete">
                    <div style={{ borderRadius:"11px", border:`1px solid ${qc.done?"rgba(255,255,255,0.07)":cat.color+"28"}`, transition:"all 0.25s", overflow:"visible" }}>
                      <div style={{ display:"flex", alignItems:"center", gap:"9px", padding:"9px 11px", background:qc.done?"rgba(255,255,255,0.02)":`${cat.color}0d` }}>
                        <div style={{ width:"2px", alignSelf:"stretch", background:qc.done?"rgba(255,255,255,0.08)":cat.color, borderRadius:"2px", flexShrink:0, minHeight:"32px" }}/>
                        <div onClick={()=>qc.done?undoQuickDone(qc.id):markQuickDone(qc.id)}
                          style={{ width:"18px", height:"18px", borderRadius:"5px", border:`1.5px solid ${qc.done?cat.color:"rgba(255,255,255,0.2)"}`, background:qc.done?cat.color:"transparent", display:"flex", alignItems:"center", justifyContent:"center", cursor:"pointer", flexShrink:0, transition:"all 0.15s" }}>
                          {qc.done&&<span style={{ fontSize:"10px", color:"#0c0c10" }}>✓</span>}
                        </div>
                        <div style={{ flex:1, minWidth:0 }}>
                          <div style={{ fontFamily:"'DM Serif Display',serif", fontSize:"13px", color:qc.done?"rgba(255,255,255,0.35)":"#f0ede8", textDecoration:qc.done?"line-through":"none", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap", transition:"all 0.2s" }}>{qc.title}</div>
                          <div style={{ fontFamily:"'DM Mono',monospace", fontSize:"9px", color:"rgba(255,255,255,0.28)", marginTop:"1px" }}>{cat.emoji} {cat.label} · {qc.duration}m</div>
                        </div>
                        {!qc.done ? (
                          <button onClick={()=>onLaunchSession({ id:qc.id, title:qc.title, category:qc.category, duration:qc.duration, energy:2, desc:"", tags:[], suitName:cat.label, scope:"personal", ownerId:currentUserId }, null, selDay)}
                            style={{ background:`${cat.color}cc`, border:"none", color:"#0c0c10", fontFamily:"'DM Mono',monospace", fontSize:"10px", fontWeight:500, padding:"5px 11px", borderRadius:"8px", cursor:"pointer", letterSpacing:"0.04em", flexShrink:0 }}>▶</button>
                        ) : (
                          <span style={{ fontFamily:"'DM Mono',monospace", fontSize:"9px", color:"rgba(255,255,255,0.25)", flexShrink:0 }}>tap ✓ to undo</span>
                        )}
                      </div>
                      {qc.done&&(
                        <div style={{ display:"flex", gap:"0", borderTop:"1px solid rgba(255,255,255,0.06)" }}>
                          <button onClick={()=>saveQuickToLibrary(qc.id, selDay)} style={{ flex:1, padding:"8px", background:"rgba(104,211,145,0.1)", border:"none", borderRight:"1px solid rgba(255,255,255,0.06)", color:"#68D391", fontFamily:"'DM Mono',monospace", fontSize:"10px", cursor:"pointer", letterSpacing:"0.04em", display:"flex", alignItems:"center", justifyContent:"center", gap:"5px" }}>
                            <span>📚</span> Save to Library
                          </button>
                          <button onClick={()=>archiveQuick(qc.id, selDay)} style={{ flex:1, padding:"8px", background:"rgba(160,174,192,0.08)", border:"none", color:"#A0AEC0", fontFamily:"'DM Mono',monospace", fontSize:"10px", cursor:"pointer", letterSpacing:"0.04em", display:"flex", alignItems:"center", justifyContent:"center", gap:"5px" }}>
                            <span>🗂</span> Archive
                          </button>
                        </div>
                      )}
                    </div>
                  </SwipeableRow>
                );
              })}
            </div>
          )}

          {showQuickForm ? (
            <div style={{ background:"rgba(255,255,255,0.03)", border:"1px solid rgba(255,255,255,0.09)", borderRadius:"12px", padding:"12px" }}>
              <input value={qTitle} onChange={e=>setQTitle(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addQuick()} placeholder="What needs doing?" autoFocus
                style={{ width:"100%", padding:"9px 11px", background:"rgba(255,255,255,0.05)", border:"1px solid rgba(255,255,255,0.1)", borderRadius:"9px", color:"#f0ede8", fontFamily:"'DM Mono',monospace", fontSize:"12px", outline:"none", boxSizing:"border-box", marginBottom:"9px" }}/>
              <div style={{ display:"flex", gap:"6px", marginBottom:"10px" }}>
                <div style={{ display:"flex", gap:"4px", flexWrap:"wrap", flex:1 }}>
                  {Object.entries(CATS).map(([k,cat])=>(
                    <button key={k} onClick={()=>setQCat(k)} style={{ background:qCat===k?`${cat.color}28`:"rgba(255,255,255,0.04)", border:`1px solid ${qCat===k?cat.color+"55":"rgba(255,255,255,0.07)"}`, color:qCat===k?cat.color:"rgba(255,255,255,0.35)", fontFamily:"'DM Mono',monospace", fontSize:"9px", padding:"3px 8px", borderRadius:"20px", cursor:"pointer" }}>{cat.emoji} {cat.label}</button>
                  ))}
                </div>
                <div style={{ display:"flex", alignItems:"center", gap:"5px", flexShrink:0 }}>
                  <button onClick={()=>setQDur(d=>Math.max(5,d-5))} style={{ width:"24px", height:"24px", borderRadius:"50%", background:"rgba(255,255,255,0.06)", border:"1px solid rgba(255,255,255,0.1)", color:"#fff", fontSize:"14px", cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center" }}>−</button>
                  <span style={{ fontFamily:"'DM Mono',monospace", fontSize:"11px", color:"#f0ede8", minWidth:"32px", textAlign:"center" }}>{qDur}m</span>
                  <button onClick={()=>setQDur(d=>Math.min(180,d+5))} style={{ width:"24px", height:"24px", borderRadius:"50%", background:"rgba(255,255,255,0.06)", border:"1px solid rgba(255,255,255,0.1)", color:"#fff", fontSize:"14px", cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center" }}>+</button>
                </div>
              </div>
              <div style={{ display:"flex", gap:"6px" }}>
                <button onClick={addQuick} disabled={!qTitle.trim()} style={{ flex:1, padding:"9px", background:qTitle.trim()?`${CATS[qCat]?.color||"#F6AD55"}cc`:"rgba(255,255,255,0.05)", border:"none", borderRadius:"9px", color:qTitle.trim()?"#0c0c10":"rgba(255,255,255,0.25)", fontFamily:"'DM Mono',monospace", fontWeight:500, fontSize:"12px", cursor:qTitle.trim()?"pointer":"not-allowed", letterSpacing:"0.04em" }}>Add Quick Card</button>
                <button onClick={()=>{setShowQuickForm(false);setQTitle("");}} style={{ padding:"9px 14px", background:"transparent", border:"1px solid rgba(255,255,255,0.09)", borderRadius:"9px", color:"rgba(255,255,255,0.35)", fontFamily:"'DM Mono',monospace", fontSize:"12px", cursor:"pointer" }}>Cancel</button>
              </div>
            </div>
          ) : (
            <button onClick={()=>setShowQuickForm(true)} style={{ width:"100%", padding:"9px", background:"rgba(255,255,255,0.03)", border:"1px dashed rgba(255,255,255,0.12)", borderRadius:"10px", color:"rgba(255,255,255,0.35)", fontFamily:"'DM Mono',monospace", fontSize:"11px", cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", gap:"6px" }}>
              <span>+</span> Quick Card
            </button>
          )}
        </div>

        {/* ── ARCHIVE ── */}
        <div style={{ marginTop:"12px" }}>
          <button onClick={()=>setShowArchive(v=>!v)} style={{ width:"100%", display:"flex", alignItems:"center", gap:"8px", background:"none", border:"none", cursor:"pointer", padding:"8px 0" }}>
            <div style={{ flex:1, height:"1px", background:"rgba(255,255,255,0.05)" }}/>
            <span style={{ fontFamily:"'DM Mono',monospace", fontSize:"9px", color:"rgba(255,255,255,0.2)", letterSpacing:"0.1em", display:"flex", alignItems:"center", gap:"5px" }}>
              {showArchive?"▾":"▸"} ARCHIVE {archive.length>0&&`(${archive.length})`}
            </span>
            <div style={{ flex:1, height:"1px", background:"rgba(255,255,255,0.05)" }}/>
          </button>

          {showArchive&&(
            <div style={{ marginTop:"8px" }}>
              <div style={{ display:"flex", alignItems:"center", gap:"8px", marginBottom:"10px", padding:"8px 10px", background:"rgba(255,255,255,0.02)", border:"1px solid rgba(255,255,255,0.06)", borderRadius:"9px" }}>
                <span style={{ fontFamily:"'DM Mono',monospace", fontSize:"9px", color:"rgba(255,255,255,0.3)", letterSpacing:"0.06em" }}>AUTO-PURGE AFTER</span>
                {editRetention ? (
                  <div style={{ display:"flex", gap:"5px", alignItems:"center", marginLeft:"auto" }}>
                    {[7,14,30].map(d=>(
                      <button key={d} onClick={()=>{onRetentionChange(d);setEditRetention(false);}}
                        style={{ background:retentionDays===d?"rgba(255,255,255,0.15)":"rgba(255,255,255,0.05)", border:`1px solid ${retentionDays===d?"rgba(255,255,255,0.2)":"rgba(255,255,255,0.08)"}`, color:retentionDays===d?"#f0ede8":"rgba(255,255,255,0.4)", fontFamily:"'DM Mono',monospace", fontSize:"10px", padding:"3px 9px", borderRadius:"6px", cursor:"pointer" }}>{d}d</button>
                    ))}
                    <button onClick={()=>setEditRetention(false)} style={{ background:"none", border:"none", color:"rgba(255,255,255,0.3)", fontFamily:"'DM Mono',monospace", fontSize:"11px", cursor:"pointer" }}>✕</button>
                  </div>
                ) : (
                  <button onClick={()=>setEditRetention(true)} style={{ marginLeft:"auto", background:"rgba(255,255,255,0.05)", border:"1px solid rgba(255,255,255,0.08)", color:"rgba(255,255,255,0.5)", fontFamily:"'DM Mono',monospace", fontSize:"10px", padding:"3px 9px", borderRadius:"6px", cursor:"pointer" }}>{retentionDays} days ✎</button>
                )}
              </div>
              {archive.length===0 ? (
                <div style={{ textAlign:"center", padding:"16px 0", fontFamily:"'DM Mono',monospace", fontSize:"10px", color:"rgba(255,255,255,0.18)" }}>Archive is empty</div>
              ) : (
                <div style={{ display:"flex", flexDirection:"column", gap:"6px" }}>
                  {archive.map(item=>{
                    const cat=CATS[item.category]||CATS.Work;
                    const daysLeft=daysUntilPurge(item.archivedAt);
                    const originDate=new Date(item.originDay+"T12:00:00");
                    const urgent=daysLeft<=3;
                    return (
                      <div key={item.id} style={{ borderRadius:"10px", border:`1px solid ${urgent?"rgba(245,101,101,0.2)":"rgba(255,255,255,0.06)"}`, overflow:"hidden" }}>
                        <div style={{ display:"flex", alignItems:"center", gap:"8px", padding:"9px 11px", background:"rgba(255,255,255,0.02)" }}>
                          <div style={{ width:"2px", alignSelf:"stretch", background:cat.color, borderRadius:"2px", flexShrink:0, opacity:0.5, minHeight:"28px" }}/>
                          <div style={{ flex:1, minWidth:0 }}>
                            <div style={{ fontFamily:"'DM Serif Display',serif", fontSize:"13px", color:"rgba(255,255,255,0.6)", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{item.title}</div>
                            <div style={{ fontFamily:"'DM Mono',monospace", fontSize:"9px", color:"rgba(255,255,255,0.22)", marginTop:"1px" }}>
                              {cat.emoji} {cat.label} · {item.duration}m · from {originDate.toLocaleDateString("en-US",{month:"short",day:"numeric"})}
                            </div>
                          </div>
                          <span style={{ fontFamily:"'DM Mono',monospace", fontSize:"9px", color:urgent?"#F56565":"rgba(255,255,255,0.25)", background:urgent?"rgba(245,101,101,0.12)":"rgba(255,255,255,0.04)", border:`1px solid ${urgent?"rgba(245,101,101,0.3)":"rgba(255,255,255,0.07)"}`, padding:"2px 7px", borderRadius:"10px", flexShrink:0 }}>
                            {daysLeft===0?"expires today":`${daysLeft}d left`}
                          </span>
                        </div>
                        <div style={{ display:"flex", borderTop:"1px solid rgba(255,255,255,0.05)" }}>
                          <button onClick={()=>restoreFromArchive(item.id)} style={{ flex:1, padding:"7px", background:"transparent", border:"none", borderRight:"1px solid rgba(255,255,255,0.05)", color:"rgba(255,255,255,0.4)", fontFamily:"'DM Mono',monospace", fontSize:"9px", cursor:"pointer", letterSpacing:"0.04em" }}>↩ Restore</button>
                          <button onClick={()=>saveArchiveToLibrary(item.id)} style={{ flex:1, padding:"7px", background:"rgba(104,211,145,0.06)", border:"none", borderRight:"1px solid rgba(255,255,255,0.05)", color:"#68D391", fontFamily:"'DM Mono',monospace", fontSize:"9px", cursor:"pointer", letterSpacing:"0.04em" }}>📚 Library</button>
                          <button onClick={()=>deleteArchiveItem(item.id)} style={{ padding:"7px 10px", background:"transparent", border:"none", color:"rgba(245,101,101,0.4)", fontFamily:"'DM Mono',monospace", fontSize:"11px", cursor:"pointer" }}>✕</button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          )}
        </div>
      </div>

      {/* Calendar sync & backup sheet */}
      {showSync&&(
        <CalendarSyncSheet decks={decks} cards={cards} schedule={schedule} quickCards={quickCards}
          currentUserId={currentUserId} onClose={()=>setShowSync(false)}/>
      )}

      {/* Deck picker sheet */}
      {showPicker&&(
        <div style={{ position:"fixed", inset:0, zIndex:200, background:"rgba(0,0,0,0.72)", backdropFilter:"blur(6px)", display:"flex", alignItems:"flex-end", justifyContent:"center" }} onClick={()=>setShowPicker(false)}>
          <div onClick={e=>e.stopPropagation()} style={{ background:"#141418", border:"1px solid rgba(255,255,255,0.09)", borderRadius:"20px 20px 0 0", padding:"18px 16px 36px", width:"100%", maxWidth:"500px", animation:"slide-up 0.28s ease" }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:"12px" }}>
              <div style={{ fontFamily:"'DM Serif Display',serif", fontSize:"17px" }}>Add to {selDate?.toLocaleDateString("en-US",{month:"short",day:"numeric"})}</div>
              <button onClick={()=>setShowPicker(false)} style={{ background:"rgba(255,255,255,0.06)", border:"1px solid rgba(255,255,255,0.09)", color:"rgba(255,255,255,0.4)", width:"28px", height:"28px", borderRadius:"8px", cursor:"pointer", fontSize:"13px" }}>✕</button>
            </div>
            <div style={{ display:"flex", flexDirection:"column", gap:"6px", maxHeight:"360px", overflowY:"auto" }}>
              {myDecks.map(deck=>{ const dc=cards.filter(c=>deck.cardIds.includes(c.id)), { totalMin }=calcCap(dc), assigned=(schedule[selDay]||[]).includes(deck.id); return (
                <div key={deck.id} onClick={()=>toggleDeck(deck.id)} style={{ display:"flex", alignItems:"center", gap:"9px", padding:"10px 12px", background:assigned?`${deck.color}18`:"rgba(255,255,255,0.03)", border:`1px solid ${assigned?deck.color+"55":"rgba(255,255,255,0.07)"}`, borderRadius:"11px", cursor:"pointer", transition:"all 0.15s" }}>
                  <span style={{ fontSize:"18px" }}>{deck.icon}</span>
                  <div style={{ flex:1 }}>
                    <div style={{ fontFamily:"'DM Serif Display',serif", fontSize:"13px", color:"#f0ede8" }}>{deck.name}</div>
                    <div style={{ fontFamily:"'DM Mono',monospace", fontSize:"9px", color:"rgba(255,255,255,0.3)", marginTop:"1px" }}>{dc.length} cards · {fmtMins(totalMin)}</div>
                  </div>
                  <div style={{ width:"18px", height:"18px", borderRadius:"5px", border:`1.5px solid ${assigned?deck.color:"rgba(255,255,255,0.2)"}`, background:assigned?deck.color:"transparent", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>{assigned&&<span style={{ fontSize:"10px", color:"#0c0c10" }}>✓</span>}</div>
                </div>
              ); })}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── VOICE CAPTURE ─────────────────────────────────────────────────
// Floating mic button + transcript display
const API_KEY_STORE = STORE_PREFIX + "anthropicKey";
const getApiKey   = () => { try { return localStorage.getItem(API_KEY_STORE) || ""; } catch { return ""; } };
const setApiKey   = (k) => { try { k ? localStorage.setItem(API_KEY_STORE, k) : localStorage.removeItem(API_KEY_STORE); } catch {} };

function VoiceCaptureButton({ onCaptured, currentUserId, todayCapacityMin, capMode }) {
  const [state,        setState]       = useState("idle"); // idle | listening | processing
  const [transcript,   setTranscript]  = useState("");
  const [interimText,  setInterimText] = useState("");
  const [error,        setError]       = useState(null);
  const [showKeyInput, setShowKeyInput]= useState(false);
  const [keyDraft,     setKeyDraft]    = useState("");

  const recogRef    = useRef(null);
  const finalRef    = useRef("");
  const interimRef  = useRef("");
  const pendingRef  = useRef("");    // transcript awaiting an API key
  const stateRef    = useRef("idle"); // mirrors state for use inside closures

  function setStateSync(s) { stateRef.current = s; setState(s); }

  function startListening() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { setError("Speech recognition not supported in this browser."); return; }
    setError(null); setTranscript(""); setInterimText("");
    finalRef.current = ""; interimRef.current = "";

    const r = new SR();
    r.continuous = true;
    r.interimResults = true;
    r.lang = "en-US";
    recogRef.current = r;

    r.onresult = (e) => {
      let newFinal = "", newInterim = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) newFinal += e.results[i][0].transcript;
        else newInterim += e.results[i][0].transcript;
      }
      if (newFinal) finalRef.current += newFinal + " ";
      interimRef.current = newInterim;
      setTranscript(finalRef.current);
      setInterimText(newInterim);
    };
    r.onerror = (e) => {
      if (e.error !== "aborted") setError("Mic error: " + e.error);
      setStateSync("idle");
    };
    // iOS fires onend naturally — use stateRef (not state) to avoid stale closure
    r.onend = () => {
      if (stateRef.current === "listening") stopListening();
    };

    r.start();
    setStateSync("listening");
  }

  function stopListening() {
    // Guard against double-call from button tap + onend both firing
    if (stateRef.current === "processing") return;
    // Flush interim
    if (interimRef.current) { finalRef.current += interimRef.current + " "; interimRef.current = ""; }
    const text = finalRef.current.trim();
    if (recogRef.current) { recogRef.current.onend = null; recogRef.current.stop(); }
    setInterimText("");
    if (text.length > 2) {
      setTranscript(text);
      setStateSync("processing");
      processTranscript(text);
    } else {
      setStateSync("idle");
    }
  }

  async function processTranscript(text) {
    // The key is supplied by the user and kept in this browser's localStorage only.
    const ANTHROPIC_KEY = getApiKey();
    if (!ANTHROPIC_KEY) {
      pendingRef.current = text;
      setTranscript(text);
      setShowKeyInput(true);
      setStateSync("idle");
      return;
    }
    // Get today's date info for the prompt
    const now = new Date();
    const todayStr = now.toLocaleDateString("en-US", { weekday:"long", month:"long", day:"numeric" });
    const tomorrowDate = new Date(now); tomorrowDate.setDate(now.getDate()+1);
    const tomorrowKey = dateKey(tomorrowDate);

    const remainingMins = capMode === "afterWork" ? Math.max(0, 300 - (todayCapacityMin||0))
      : capMode === "fullDay" ? Math.max(0, 900 - (todayCapacityMin||0)) : null;

    const prompt = `Today is ${todayStr}. Extract tasks from this voice note and return a JSON array.

Each task needs:
- "title": clear task name, max 8 words
- "duration": estimated minutes as a number (min 5, max 180)
- "energy": 1-5 number (1=very light, 5=very draining)
- "category": one of: Work, SelfCare, Home, Creative, Social
- "schedule": when to do it — "today", "tomorrow", or "YYYY-MM-DD" for specific dates, or "someday" for vague future things. Listen carefully for words like "tomorrow", "next week", "on Friday", "this weekend", "later". If no timing is mentioned, default to "today".
- "note": one short warm sentence of context, max 10 words${remainingMins !== null ? `\n\nToday has about ${remainingMins} minutes of capacity remaining. If a task won't fit today, suggest "tomorrow" instead.` : ""}

Voice note: "${text}"

Return ONLY a valid JSON array. No markdown, no explanation, no code blocks.`;

    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": ANTHROPIC_KEY,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true",
        },
        body: JSON.stringify({
          model: "claude-haiku-4-5-20251001",
          max_tokens: 1000,
          messages: [{ role:"user", content: prompt }],
        }),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        console.error("DeckForge voice API error:", res.status, err);
        if (res.status === 401) { setApiKey(""); pendingRef.current = text; setShowKeyInput(true); setError("API key invalid — enter a new one."); }
        else if (res.status === 403) { setError("403 — browser access not enabled for this key."); }
        else { setError(`Error ${res.status}: ${err?.error?.message || JSON.stringify(err).slice(0,80)}`); }
        setState("idle"); return;
      }
      const data = await res.json();
      console.log("DeckForge voice response:", data);
      const raw = data.content?.[0]?.text || "";
      console.log("DeckForge raw text:", raw);
      if (!raw) { setError("No response from API — check console."); setState("idle"); return; }
      let parsed;
      try {
        const clean = raw.replace(/```json|```/g, "").trim();
        parsed = JSON.parse(clean);
      } catch(parseErr) {
        console.error("JSON parse failed:", parseErr, "raw was:", raw);
        setError(`Parse error — raw: ${raw.slice(0, 80)}`);
        setState("idle"); return;
      }
      if (Array.isArray(parsed) && parsed.length > 0) {
        onCaptured(parsed, text);
        setState("idle"); setTranscript("");
      } else { setError("No tasks found — try speaking more clearly."); setState("idle"); }
    } catch(e) {
      console.error("DeckForge voice fetch error:", e);
      setError(`Failed: ${e.message || "network error"}`); setState("idle");
    }
  }

  const isListening   = state === "listening";
  const isProcessing  = state === "processing";
  const displayText   = transcript + (interimText ? interimText : "");

  return (
    <div style={{ position:"fixed", bottom:"80px", right:"16px", zIndex:500, display:"flex", flexDirection:"column", alignItems:"flex-end", gap:"8px" }}>
      {/* Live transcript bubble */}
      {(isListening || isProcessing) && (
        <div style={{ background:"rgba(14,14,20,0.96)", border:"1px solid rgba(255,255,255,0.12)", borderRadius:"16px", padding:"10px 14px", maxWidth:"240px", backdropFilter:"blur(12px)", boxShadow:"0 8px 24px rgba(0,0,0,0.6)", animation:"slide-up 0.2s ease" }}>
          {isProcessing ? (
            <div style={{ display:"flex", alignItems:"center", gap:"8px" }}>
              <div style={{ display:"flex", gap:"3px" }}>
                {[0,1,2].map(i=><div key={i} style={{ width:"5px", height:"5px", borderRadius:"50%", background:"#F6AD55", animation:`pulse 1s ${i*0.2}s ease-in-out infinite` }}/>)}
              </div>
              <span style={{ fontFamily:"'DM Mono',monospace", fontSize:"10px", color:"rgba(255,255,255,0.5)" }}>Extracting tasks…</span>
            </div>
          ) : (
            <div>
              <div style={{ fontFamily:"'DM Mono',monospace", fontSize:"9px", color:"rgba(255,255,255,0.28)", letterSpacing:"0.08em", marginBottom:"5px", display:"flex", alignItems:"center", gap:"5px" }}>
                <div style={{ width:"5px", height:"5px", borderRadius:"50%", background:"#F56565", animation:"pulse 0.8s ease-in-out infinite" }}/>
                LISTENING
              </div>
              <div style={{ fontFamily:"'DM Mono',monospace", fontSize:"11px", color:"#f0ede8", lineHeight:1.5, wordBreak:"break-word" }}>
                {displayText || <span style={{ color:"rgba(255,255,255,0.25)", fontStyle:"italic" }}>Start speaking…</span>}
              </div>
            </div>
          )}
        </div>
      )}
      {/* API key setup */}
      {showKeyInput && (
        <div style={{ background:"rgba(14,14,20,0.97)", border:"1px solid rgba(246,173,85,0.3)", borderRadius:"14px", padding:"12px 14px", width:"min(260px, 80vw)", backdropFilter:"blur(12px)", boxShadow:"0 8px 24px rgba(0,0,0,0.6)", animation:"slide-up 0.2s ease" }}>
          <div style={{ fontFamily:"'DM Mono',monospace", fontSize:"9px", color:"#F6AD55", letterSpacing:"0.08em", marginBottom:"6px" }}>ANTHROPIC API KEY NEEDED</div>
          <div style={{ fontFamily:"'DM Mono',monospace", fontSize:"9px", color:"rgba(255,255,255,0.4)", lineHeight:1.5, marginBottom:"8px" }}>
            Voice capture uses Claude to extract tasks. Paste a key from console.anthropic.com — it stays in this browser only.
          </div>
          <input type="password" value={keyDraft} onChange={e=>setKeyDraft(e.target.value)} placeholder="sk-ant-…" autoFocus
            style={{ width:"100%", padding:"8px 10px", background:"rgba(255,255,255,0.05)", border:"1px solid rgba(255,255,255,0.12)", borderRadius:"8px", color:"#f0ede8", fontFamily:"'DM Mono',monospace", fontSize:"11px", outline:"none", boxSizing:"border-box", marginBottom:"8px" }}/>
          <div style={{ display:"flex", gap:"6px" }}>
            <button onClick={()=>{
              const k = keyDraft.trim();
              if (!k) return;
              setApiKey(k); setKeyDraft(""); setShowKeyInput(false); setError(null);
              if (pendingRef.current) { const t = pendingRef.current; pendingRef.current = ""; setStateSync("processing"); processTranscript(t); }
            }} disabled={!keyDraft.trim()}
              style={{ flex:1, padding:"8px", background:keyDraft.trim()?"linear-gradient(135deg,#FC814Acc,#F6AD55aa)":"rgba(255,255,255,0.05)", border:"none", borderRadius:"8px", color:keyDraft.trim()?"#0c0c10":"rgba(255,255,255,0.25)", fontFamily:"'DM Mono',monospace", fontWeight:500, fontSize:"11px", cursor:keyDraft.trim()?"pointer":"not-allowed" }}>Save key</button>
            <button onClick={()=>{ setShowKeyInput(false); setKeyDraft(""); pendingRef.current=""; }}
              style={{ padding:"8px 12px", background:"rgba(255,255,255,0.04)", border:"1px solid rgba(255,255,255,0.09)", borderRadius:"8px", color:"rgba(255,255,255,0.4)", fontFamily:"'DM Mono',monospace", fontSize:"11px", cursor:"pointer" }}>Cancel</button>
          </div>
        </div>
      )}
      {/* Error bubble */}
      {error && (
        <div style={{ background:"rgba(245,101,101,0.15)", border:"1px solid rgba(245,101,101,0.3)", borderRadius:"12px", padding:"8px 12px", maxWidth:"200px" }}>
          <span style={{ fontFamily:"'DM Mono',monospace", fontSize:"10px", color:"#F56565" }}>{error}</span>
        </div>
      )}
      {/* Mic button */}
      <button
        onClick={isListening ? stopListening : isProcessing ? undefined : startListening}
        disabled={isProcessing}
        style={{
          width:"48px", height:"48px", borderRadius:"50%",
          background: isListening
            ? "linear-gradient(135deg,#F56565,#FC814A)"
            : isProcessing
              ? "rgba(246,173,85,0.2)"
              : "linear-gradient(135deg,rgba(28,28,40,0.95),rgba(20,20,28,0.98))",
          border: isListening
            ? "none"
            : "1px solid rgba(255,255,255,0.12)",
          boxShadow: isListening
            ? "0 0 0 0 rgba(245,101,101,0.4), 0 4px 16px rgba(0,0,0,0.5)"
            : "0 4px 16px rgba(0,0,0,0.4)",
          cursor: isProcessing ? "default" : "pointer",
          display:"flex", alignItems:"center", justifyContent:"center",
          fontSize:"20px",
          animation: isListening ? "mic-pulse 1.5s ease-in-out infinite" : "none",
          transition:"background 0.2s, box-shadow 0.2s",
          flexShrink:0,
        }}
        title={isListening ? "Tap to stop" : "Voice capture"}
      >
        {isProcessing ? (
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <circle cx="10" cy="10" r="8" stroke="rgba(246,173,85,0.6)" strokeWidth="2" strokeDasharray="25 13" strokeLinecap="round">
              <animateTransform attributeName="transform" type="rotate" from="0 10 10" to="360 10 10" dur="1s" repeatCount="indefinite"/>
            </circle>
          </svg>
        ) : isListening ? (
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <rect x="4" y="4" width="10" height="10" rx="2" fill="#fff"/>
          </svg>
        ) : (
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <rect x="7" y="1" width="6" height="10" rx="3" fill="rgba(255,255,255,0.75)"/>
            <path d="M3 9a7 7 0 0 0 14 0" stroke="rgba(255,255,255,0.75)" strokeWidth="1.5" strokeLinecap="round"/>
            <line x1="10" y1="16" x2="10" y2="19" stroke="rgba(255,255,255,0.75)" strokeWidth="1.5" strokeLinecap="round"/>
            <line x1="7" y1="19" x2="13" y2="19" stroke="rgba(255,255,255,0.75)" strokeWidth="1.5" strokeLinecap="round"/>
          </svg>
        )}
      </button>
      <style>{`@keyframes mic-pulse { 0%,100%{box-shadow:0 0 0 0 rgba(245,101,101,0.4),0 4px 16px rgba(0,0,0,0.5)} 50%{box-shadow:0 0 0 10px rgba(245,101,101,0),0 4px 16px rgba(0,0,0,0.5)} }`}</style>
    </div>
  );
}

// ── VOICE REVIEW SHEET ────────────────────────────────────────────
function VoiceReviewSheet({ cards, transcript, onConfirm, onDismiss }) {
  const [items, setItems] = useState(cards.map((c,i) => ({
    ...c,
    _id: i,
    _removed: false,
    _editing: false,
  })));

  function update(id, patch) {
    setItems(p => p.map(it => it._id === id ? {...it, ...patch} : it));
  }
  function remove(id) { update(id, { _removed: true }); }
  function restore(id) { update(id, { _removed: false }); }
  function toggleEdit(id) { setItems(p => p.map(it => it._id === id ? {...it, _editing:!it._editing} : {...it, _editing:false})); }

  const active = items.filter(it => !it._removed);
  const removed = items.filter(it => it._removed);

  function scheduleLabel(s) {
    if (!s || s === "today") return "Today";
    if (s === "tomorrow") return "Tomorrow";
    if (s === "someday") return "Someday";
    try {
      const d = new Date(s + "T12:00:00");
      return d.toLocaleDateString("en-US", { weekday:"short", month:"short", day:"numeric" });
    } catch { return s; }
  }

  function scheduleColor(s) {
    if (!s || s === "today") return "#68D391";
    if (s === "tomorrow") return "#F6AD55";
    if (s === "someday") return "#A0AEC0";
    return "#63B3ED";
  }

  return (
    <div style={{ position:"fixed", inset:0, zIndex:600, background:"rgba(0,0,0,0.78)", backdropFilter:"blur(8px)", display:"flex", alignItems:"flex-end", justifyContent:"center" }}>
      <div style={{ background:"#0f0f14", border:"1px solid rgba(255,255,255,0.09)", borderRadius:"22px 22px 0 0", width:"100%", maxWidth:"520px", maxHeight:"88vh", display:"flex", flexDirection:"column", animation:"slide-up 0.3s ease" }}>

        {/* Header */}
        <div style={{ padding:"18px 18px 12px", borderBottom:"1px solid rgba(255,255,255,0.06)", flexShrink:0 }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start" }}>
            <div>
              <div style={{ fontFamily:"'DM Serif Display',serif", fontSize:"20px", color:"#f0ede8" }}>Review Captured Tasks</div>
              <div style={{ fontFamily:"'DM Mono',monospace", fontSize:"9px", color:"rgba(255,255,255,0.28)", marginTop:"3px", letterSpacing:"0.06em" }}>
                {active.length} task{active.length !== 1 ? "s" : ""} extracted · tap any field to edit
              </div>
            </div>
            <button onClick={onDismiss} style={{ background:"rgba(255,255,255,0.06)", border:"1px solid rgba(255,255,255,0.09)", color:"rgba(255,255,255,0.4)", width:"30px", height:"30px", borderRadius:"8px", cursor:"pointer", fontSize:"14px", flexShrink:0 }}>✕</button>
          </div>
          {/* Transcript preview */}
          <div style={{ marginTop:"10px", padding:"8px 10px", background:"rgba(255,255,255,0.03)", border:"1px solid rgba(255,255,255,0.06)", borderRadius:"9px" }}>
            <div style={{ fontFamily:"'DM Mono',monospace", fontSize:"9px", color:"rgba(255,255,255,0.2)", letterSpacing:"0.08em", marginBottom:"3px" }}>TRANSCRIPT</div>
            <div style={{ fontFamily:"'DM Mono',monospace", fontSize:"10px", color:"rgba(255,255,255,0.4)", lineHeight:1.5, maxHeight:"48px", overflow:"hidden" }}>{transcript}</div>
          </div>
        </div>

        {/* Card list */}
        <div style={{ overflowY:"auto", padding:"12px 18px", flex:1 }}>
          {active.map(item => {
            const cat = getCat(item.category);
            const schedColor = scheduleColor(item.schedule);
            return (
              <div key={item._id} style={{ background:`linear-gradient(135deg,${cat.bg},rgba(16,16,22,0.97))`, border:`1px solid ${cat.color}33`, borderRadius:"14px", marginBottom:"10px", overflow:"hidden", transition:"all 0.2s" }}>
                {/* Card header row */}
                <div style={{ display:"flex", alignItems:"center", gap:"8px", padding:"11px 13px 8px" }}>
                  {/* Category selector */}
                  <div style={{ position:"relative" }}>
                    <select value={item.category} onChange={e => update(item._id, { category: e.target.value })}
                      style={{ background:"transparent", border:"none", fontSize:"16px", cursor:"pointer", outline:"none", appearance:"none", padding:"0 2px" }}>
                      {Object.entries(CATS).map(([k,c]) => <option key={k} value={k}>{c.emoji}</option>)}
                    </select>
                  </div>
                  {/* Title */}
                  <input value={item.title} onChange={e => update(item._id, { title: e.target.value })}
                    style={{ flex:1, background:"transparent", border:"none", outline:"none", fontFamily:"'DM Serif Display',serif", fontSize:"15px", color:"#f0ede8", minWidth:0 }}/>
                  {/* Schedule badge */}
                  <button onClick={() => {
                    const opts = ["today","tomorrow","someday"];
                    const cur = item.schedule || "today";
                    const next = opts[(opts.indexOf(cur)+1) % opts.length];
                    update(item._id, { schedule: next });
                  }} style={{ background:`${schedColor}18`, border:`1px solid ${schedColor}44`, color:schedColor, fontFamily:"'DM Mono',monospace", fontSize:"9px", padding:"3px 8px", borderRadius:"10px", cursor:"pointer", whiteSpace:"nowrap", flexShrink:0 }}>
                    {scheduleLabel(item.schedule)}
                  </button>
                  {/* Remove */}
                  <button onClick={() => remove(item._id)} style={{ background:"transparent", border:"none", color:"rgba(255,255,255,0.2)", fontSize:"14px", cursor:"pointer", padding:"2px", flexShrink:0, lineHeight:1 }}>✕</button>
                </div>

                {/* Editable detail row */}
                <div style={{ display:"flex", alignItems:"center", gap:"10px", padding:"0 13px 11px" }}>
                  {/* Duration stepper */}
                  <div style={{ display:"flex", alignItems:"center", gap:"4px" }}>
                    <button onClick={() => update(item._id, { duration: Math.max(5, (item.duration||25)-5) })}
                      style={{ width:"20px", height:"20px", borderRadius:"50%", background:"rgba(255,255,255,0.06)", border:"1px solid rgba(255,255,255,0.1)", color:"#fff", fontSize:"12px", cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center" }}>−</button>
                    <input type="number" value={item.duration||25} min="5" max="180"
                      onChange={e => update(item._id, { duration: Math.max(5, Math.min(180, parseInt(e.target.value)||25)) })}
                      style={{ width:"38px", textAlign:"center", background:"transparent", border:"none", outline:"none", fontFamily:"'DM Mono',monospace", fontSize:"11px", color:"rgba(255,255,255,0.6)" }}/>
                    <span style={{ fontFamily:"'DM Mono',monospace", fontSize:"9px", color:"rgba(255,255,255,0.28)" }}>m</span>
                    <button onClick={() => update(item._id, { duration: Math.min(180, (item.duration||25)+5) })}
                      style={{ width:"20px", height:"20px", borderRadius:"50%", background:"rgba(255,255,255,0.06)", border:"1px solid rgba(255,255,255,0.1)", color:"#fff", fontSize:"12px", cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center" }}>+</button>
                  </div>

                  {/* Energy pips */}
                  <div style={{ display:"flex", gap:"3px", alignItems:"center" }}>
                    {[1,2,3,4,5].map(n => (
                      <button key={n} onClick={() => update(item._id, { energy: n })}
                        style={{ width:"14px", height:"14px", borderRadius:"3px", background:n<=(item.energy||2)?ENERGY[n].bar:"rgba(255,255,255,0.08)", border:"none", cursor:"pointer", padding:0, transition:"all 0.12s" }}/>
                    ))}
                  </div>

                  {/* Note */}
                  <input value={item.note||""} onChange={e => update(item._id, { note: e.target.value })}
                    placeholder="add a note…"
                    style={{ flex:1, background:"transparent", border:"none", outline:"none", fontFamily:"'DM Mono',monospace", fontSize:"10px", color:"rgba(255,255,255,0.35)", minWidth:0 }}/>
                </div>
              </div>
            );
          })}

          {/* Removed items */}
          {removed.length > 0 && (
            <div style={{ marginTop:"4px" }}>
              <div style={{ fontFamily:"'DM Mono',monospace", fontSize:"9px", color:"rgba(255,255,255,0.2)", letterSpacing:"0.08em", marginBottom:"6px" }}>REMOVED</div>
              {removed.map(item => (
                <div key={item._id} style={{ display:"flex", alignItems:"center", gap:"8px", padding:"7px 10px", background:"rgba(255,255,255,0.02)", border:"1px solid rgba(255,255,255,0.05)", borderRadius:"9px", marginBottom:"5px", opacity:0.5 }}>

                </div>
              ))}
            </div>
          )}
        </div>

        {/* Footer */}
        <div style={{ padding:"12px 18px 28px", borderTop:"1px solid rgba(255,255,255,0.06)", flexShrink:0, display:"flex", gap:"8px" }}>
          <button onClick={onDismiss} style={{ padding:"12px 18px", background:"rgba(255,255,255,0.04)", border:"1px solid rgba(255,255,255,0.09)", borderRadius:"12px", color:"rgba(255,255,255,0.4)", fontFamily:"'DM Mono',monospace", fontSize:"12px", cursor:"pointer" }}>Discard</button>

            disabled={active.length === 0}
            style={{ flex:1, padding:"12px", background:active.length > 0 ? "linear-gradient(135deg,#FC814Acc,#F6AD55aa)" : "rgba(255,255,255,0.04)", border:"none", borderRadius:"12px", color:active.length > 0 ? "#0c0c10" : "rgba(255,255,255,0.2)", fontFamily:"'DM Mono',monospace", fontWeight:500, fontSize:"13px", cursor:active.length > 0 ? "pointer" : "not-allowed", letterSpacing:"0.04em" }}>
            Add {active.length} card{active.length !== 1 ? "s" : ""} →
          </button>
        </div>
      </div>
    </div>
  );
}

// ── CALENDAR SYNC & BACKUP SHEET ──────────────────────────────────
function CalendarSyncSheet({ decks, cards, schedule, quickCards, currentUserId, onClose }) {
  const [status, setStatus] = useState(null);
  const fileRef = useRef(null);
  const events = buildCalendarEvents({ decks, cards, schedule, quickCards, currentUserId });

  function dayLabel(key) {
    if (key === todayKey) return "Today";
    const d = new Date(key + "T12:00:00");
    return d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
  }

  function handleImport(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    importBackup(file, ok => {
      if (ok) { setStatus({ ok: true, msg: "Backup restored — reloading…" }); setTimeout(() => location.reload(), 900); }
      else setStatus({ ok: false, msg: "Couldn't read that file — is it a DeckForge backup?" });
    });

        <div style={{ fontFamily:"'DM Mono',monospace", fontSize:"10px", color:"rgba(255,255,255,0.38)", lineHeight:1.6, marginBottom:"10px" }}>

        </div>

        {status && (
          <div style={{ marginTop:"12px", padding:"8px 12px", borderRadius:"9px", fontFamily:"'DM Mono',monospace", fontSize:"10px",
            background: status.ok ? "rgba(104,211,145,0.1)" : "rgba(245,101,101,0.12)",
            border: `1px solid ${status.ok ? "rgba(104,211,145,0.28)" : "rgba(245,101,101,0.3)"}`,
            color: status.ok ? "#68D391" : "#F56565" }}>
            {status.msg}
          </div>
        )}
      </div>
    </div>
  );
}
