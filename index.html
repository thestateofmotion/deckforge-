// ── MAIN APP ──────────────────────────────────────────────────────
function App() {
  // Durable data survives reloads via localStorage; seeds only apply on first run
  const [uid,        setUid]        = usePersistentState("uid", "lance");
  const [view,       setView]       = useState("planner");
  const [cards,      setCards]      = usePersistentState("cards", SEED_CARDS);
  const [decks,      setDecks]      = usePersistentState("decks", SEED_DECKS);
  const [schedule,   setSchedule]   = usePersistentState("schedule", SEED_SCHED);
  const [requests,   setRequests]   = usePersistentState("requests", SEED_REQS);
  const [shared,     setShared]     = usePersistentState("shared", SEED_SHARED);
  const [filterCat,  setFilterCat]  = useState("All");
  const [toast,      setToast]      = useState(null);
  const [deckModal,  setDeckModal]  = useState(null);
  const [capMode,    setCapMode]    = usePersistentState("capMode", "afterWork");
  const [customMin,  setCustomMin]  = usePersistentState("customMin", 300);
  const [customEng,  setCustomEng]  = usePersistentState("customEng", 200);
  const [builderDid, setBuilderDid] = useState(1);
  const [quickCards,     setQuickCards]     = usePersistentState("quickCards", SEED_QUICK);
  const [archive,        setArchive]        = usePersistentState("archive", SEED_ARCHIVE);
  const [sharedArchive,  setSharedArchive]  = usePersistentState("sharedArchive", []);
  const [retentionDays,  setRetentionDays]  = usePersistentState("retentionDays", DEFAULT_RETENTION_DAYS);
  const [visible,      setVisible]      = useState(false);
  const [showNewCard,  setShowNewCard]  = useState(false);
  const [editingCard,  setEditingCard]  = useState(null);
  const [currentEnergy, setCurrentEnergy] = useState(0);

  // ── Session history ──
  const [completedSessions, setCompletedSessions] = usePersistentState("sessions", SEED_SESSIONS);

  // Auto-purge archive items past their retention window (was advertised but never ran)
  useEffect(() => {
    const cutoff = Date.now() - retentionDays * 86400000;
    setArchive(p => {
      const kept = p.filter(a => new Date(a.archivedAt).getTime() > cutoff);
      return kept.length === p.length ? p : kept;
    });
  }, []);

  // ── Voice capture ──
  const [voiceCards,    setVoiceCards]    = useState(null); // extracted cards pending review
  const [voiceTranscript, setVoiceTranscript] = useState("");

  // ── Send card ──
  const [sendCard, setSendCard] = useState(null);
  function sendCardTo(toId, message) {
    setRequests(p=>[...p, { id:Date.now(), fromId:uid, toId, cardId:sendCard.id, message, status:"pending", createdAt:"just now" }]);
    showToast(`Card sent to ${MEMBERS[toId]?.name} ↗`);
    setSendCard(null);
  }

  // ── Demo mode ──
  const DEMO_CARD_IDS = SEED_CARDS.map(c => c.id);
  const DEMO_DECK_IDS = SEED_DECKS.map(d => d.id);

  function clearDemoData() {
    setCards(p => p.filter(c => !c._demo));
    setDecks(p => p.filter(d => !d._demo));
    setSchedule(p => {
      const n = {...p};
      Object.keys(n).forEach(k => { n[k] = (n[k]||[]).filter(id => !DEMO_DECK_IDS.includes(id)); });
      return n;
    });
    setQuickCards({});
    setArchive([]);
    setSharedArchive([]);
    setCompletedSessions(p => p.filter(s => !SEED_SESSIONS.some(ss => ss.id === s.id)));
    setRequests(p => p.filter(r => !SEED_REQS.some(sr => sr.id === r.id)));
    setShared(p => {
      const n = {...p};
      DEMO_CARD_IDS.forEach(id => { delete n[id]; });
      return n;
    });
    setBuilderDid(null);
  }

  const hasDemoData = cards.some(c => c._demo) || decks.some(d => d._demo);

  // Compute today's loaded minutes for voice capacity awareness
  const todayCapacityMin = (() => {
    const deckLoad = (schedule[todayKey]||[]).reduce((s,did) => {
      const dk = decks.find(d=>d.id===did); if(!dk) return s;
      return s + cards.filter(c=>dk.cardIds.includes(c.id)).reduce((ss,c)=>ss+c.duration,0);
    }, 0);
    const quickLoad = (quickCards[todayKey]||[]).filter(q=>!q.done).reduce((s,q)=>s+(q.duration||25),0);
    return deckLoad + quickLoad;
  })();

  // ── Top-level session state ──
  const [sessionCard,    setSessionCard]    = useState(null);
  const [sessionDeck,    setSessionDeck]    = useState(null);
  const [plannerCompletedIds, setPlannerCompletedIds] = useState([]);
  const [plannerQuickDay,     setPlannerQuickDay]     = useState(todayKey);

  const me       = MEMBERS[uid];
  const inbox    = requests.filter(r=>r.toId===uid&&r.status==="pending").length;
  const myCards  = cards.filter(c=>c.ownerId===uid&&c.scope==="personal");
  const shCards  = cards.filter(c=>c.scope==="shared");
  const myDecks  = decks.filter(d=>d.ownerId===uid||d.scope==="shared");
  const bDeck    = decks.find(d=>d.id===builderDid);
  const bCards   = bDeck?cards.filter(c=>bDeck.cardIds.includes(c.id)):[];

  useEffect(()=>{ setVisible(false); const id=setTimeout(()=>setVisible(true),80); return()=>clearTimeout(id); },[view,filterCat,uid]);

  const showToast = (msg) => { setToast(msg); setTimeout(()=>setToast(null),2800); };

  function saveDeck(data) {
    if(deckModal==="new"){ const nd={id:Date.now(),ownerId:uid,...data}; setDecks(p=>[...p,nd]); setBuilderDid(nd.id); showToast(`"${data.name}" created ✓`); }
    else { setDecks(p=>p.map(d=>d.id===deckModal.id?{...d,...data}:d)); showToast(`"${data.name}" saved ✓`); }
    setDeckModal(null);
  }

      recurrence:data.recurrence||"none",
      recurDow:data.recurrence==="weekly"?new Date().getDay():undefined,

  function handleVoiceConfirm(items) {
    // items = reviewed array from VoiceReviewSheet
    const newCards = [];
    const scheduleUpdates = { ...schedule };

    items.forEach((item, i) => {
      const card = {
        id: Date.now() + i,
        ownerId: uid,
        scope: "personal",
        title: item.title,
        category: item.category || "Work",
        suitName: CATS[item.category]?.label || "Task",
        desc: item.note || "",
        tags: [],
        duration: Number(item.duration) || 25,
        energy: Number(item.energy) || 2,
        recurrence: "none",
      };
      newCards.push(card);

      // Schedule based on the schedule field
      const sched = item.schedule || "today";
      let targetDay = null;
      if (sched === "today") targetDay = todayKey;
      else if (sched === "tomorrow") {
        const t = new Date(); t.setDate(t.getDate()+1);
        targetDay = dateKey(t);
      } else if (sched !== "someday" && /^\d{4}-\d{2}-\d{2}$/.test(sched)) {
        targetDay = sched;
      }
      // "someday" → goes to library only, not scheduled

      if (targetDay) {
        // Add as a quick card for that day
        setQuickCards(prev => ({
          ...prev,
          [targetDay]: [...(prev[targetDay]||[]), {
            id: "q" + (Date.now() + i),
            title: card.title,
            category: card.category,
            duration: card.duration,
            done: false,
            completedAt: null,
          }],
        }));
      }
    });

    setCards(p => [...p, ...newCards]);
    setVoiceCards(null);
    setVoiceTranscript("");

    const todayCount = items.filter(it => (it.schedule||"today") === "today").length;
    const tomorrowCount = items.filter(it => it.schedule === "tomorrow").length;
    const somedayCount = items.filter(it => it.schedule === "someday").length;
    const parts = [];
    if (todayCount) parts.push(`${todayCount} today`);
    if (tomorrowCount) parts.push(`${tomorrowCount} tomorrow`);
    if (somedayCount) parts.push(`${somedayCount} in library`);
    showToast(`${items.length} cards added — ${parts.join(", ")} ✓`);
  }

                    </details>
                    <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"12px" }}>
                      <div><div style={{ fontFamily:"'DM Mono',monospace", fontSize:"9px", color:"rgba(255,255,255,0.22)", letterSpacing:"0.1em", marginBottom:"8px" }}>AVAILABLE</div><div style={{ display:"flex", flexDirection:"column", gap:"6px" }}>{[...myCards,...shCards].filter(c=>!bDeck.cardIds.includes(c.id)).map((c,i)=><CardTile key={c.id} card={c} onClick={()=>toggleInDeck(c.id)} compact index={i} visible={visible}/>)}</div></div>
                      <div><div style={{ fontFamily:"'DM Mono',monospace", fontSize:"9px", color:bDeck.color, letterSpacing:"0.1em", marginBottom:"8px" }}>IN DECK</div><div style={{ display:"flex", flexDirection:"column", gap:"6px" }}>{bCards.map((c,i)=><CardTile key={c.id} card={c} onClick={()=>toggleInDeck(c.id)} inDeck compact index={i} visible={visible}/>)}{bDeck.cardIds.length===0&&<div style={{ border:`2px dashed ${bDeck.color}2a`, borderRadius:"12px", padding:"28px 12px", textAlign:"center", fontFamily:"'DM Mono',monospace", fontSize:"10px", color:"rgba(255,255,255,0.18)" }}>Tap cards to add</div>}</div></div>
                    </div>
                  </>
                )}
              </div>
            )}

            {/* PLANNER */}
            {view==="planner"&&(
              <Planner
                decks={decks} cards={cards} schedule={schedule} onScheduleChange={setSchedule}
                quickCards={quickCards} onQuickChange={setQuickCards}
                archive={archive} onArchiveChange={setArchive}
                retentionDays={retentionDays} onRetentionChange={setRetentionDays}
                onSaveToLibrary={saveToLibrary}
                currentEnergy={currentEnergy} onEnergyChange={setCurrentEnergy}
                capMode={capMode} onCapModeChange={setCapMode}
                customMin={customMin} customEnergy={customEng}
                currentUserId={uid} onUpdateCard={updateCard}
                sharedArchive={sharedArchive}
                onSharedArchive={(item)=>setSharedArchive(p=>[...p,item])}
                onEditCard={editCard} onDeleteCard={(id)=>deleteCard(id)}
                onLaunchSession={(card, deck, dayKey)=>{
                  setSessionCard(card); setSessionDeck(deck||null);
                  setPlannerQuickDay(dayKey||todayKey);
                }}
                completedIds={plannerCompletedIds}
                onSetCompletedIds={setPlannerCompletedIds}
                completedSessions={completedSessions}
              />
            )}

          </ViewPane>
        </div>
      </div>

      {/* Floating voice capture button */}
      {!sessionCard && (
        <VoiceCaptureButton
          onCaptured={(cards, transcript) => { setVoiceCards(cards); setVoiceTranscript(transcript); }}
          currentUserId={uid}
          todayCapacityMin={todayCapacityMin}
          capMode={capMode}
        />
      )}
    </>
  );
}


    // ── ERROR BOUNDARY ────────────────────────────────────────────
    // With persisted state, a corrupt save could otherwise blank the app forever.
    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { error: null }; }
      static getDerivedStateFromError(error) { return { error }; }
      resetData() {
        try {
          Object.keys(localStorage)
            .filter(k => k.startsWith(STORE_PREFIX))
            .forEach(k => localStorage.removeItem(k));
        } catch {}
        location.reload();
      }
      render() {
        if (!this.state.error) return this.props.children;
        return (
          <div style={{ minHeight:"100vh", background:"#0c0c10", color:"#f0ede8", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:"24px", textAlign:"center", fontFamily:"'DM Mono',monospace" }}>
            <div style={{ fontSize:"34px", marginBottom:"14px" }}>🃏</div>
            <div style={{ fontFamily:"'DM Serif Display',serif", fontSize:"22px", marginBottom:"8px" }}>Something went wrong</div>
            <div style={{ fontSize:"11px", color:"rgba(255,255,255,0.4)", maxWidth:"360px", lineHeight:1.6, marginBottom:"20px" }}>
              {String(this.state.error?.message || this.state.error)}
            </div>
            <div style={{ display:"flex", gap:"10px" }}>
              <button onClick={()=>location.reload()} style={{ background:"linear-gradient(135deg,#FC814Acc,#F6AD55aa)", border:"none", color:"#0c0c10", fontFamily:"'DM Mono',monospace", fontWeight:500, fontSize:"12px", padding:"11px 18px", borderRadius:"10px", cursor:"pointer" }}>Reload</button>
              <button onClick={()=>this.resetData()} style={{ background:"rgba(245,101,101,0.12)", border:"1px solid rgba(245,101,101,0.3)", color:"#F56565", fontFamily:"'DM Mono',monospace", fontSize:"12px", padding:"11px 18px", borderRadius:"10px", cursor:"pointer" }}>Reset saved data</button>
            </div>
          </div>
        );
      }
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ErrorBoundary><App/></ErrorBoundary>);
  </script>
</body>
</html>
